name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.23.5", "24.22.3", "26.13.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Restore the pinned FFmpeg archive
        id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/nanoodle-ffmpeg.tar.xz
          key: ffmpeg-7.0.2-linux-amd64-abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      # Use the same pinned build as Nanoodle MCP to exercise local media paths.
      - name: Install FFmpeg and ffprobe for tests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nanoodle-ffmpeg.tar.xz"
          build=ffmpeg-7.0.2-amd64-static
          url="https://johnvansickle.com/ffmpeg/releases/$build.tar.xz"
          verify_archive() {
            printf '%s  %s\n' abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67 "$archive" | sha256sum --check --status
          }
          if [[ ! -f $archive ]] || ! verify_archive; then
            for attempt in 1 2; do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 45 \
                --header 'Cache-Control: no-cache' --output "$archive" "$url" && verify_archive; then
                break
              fi
            done
          fi
          if ! verify_archive; then
            echo 'Unable to verify the pinned FFmpeg archive' >&2
            exit 1
          fi
          tar -xJf "$archive" -C "$RUNNER_TEMP" "$build/ffmpeg" "$build/ffprobe"
          printf '%s\n' "$RUNNER_TEMP/$build" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$build/ffmpeg" -hide_banner -version
          "$RUNNER_TEMP/$build/ffprobe" -hide_banner -version
      - name: Cache the verified FFmpeg archive
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/nanoodle-ffmpeg.tar.xz
          key: ffmpeg-7.0.2-linux-amd64-abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      # offline unit tests only — zero npm deps; the mock harness provides every
      # endpoint. NEVER add live NanoGPT calls here.
      - run: npm test

  package:
    name: Pack tested npm distribution
    if: github.event_name == 'pull_request' || (github.repository == 'nanoodlecom/nanoodle-js' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pack.outputs.version }}
      source_version: ${{ steps.source.outputs.source_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Pack and validate the release archive
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/distribution"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/distribution" > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, renameSync } from 'node:fs';
          import { join } from 'node:path';
          const { RUNNER_TEMP, GITHUB_OUTPUT } = process.env;
          const [packed] = JSON.parse(readFileSync(join(RUNNER_TEMP, 'pack.json'), 'utf8'));
          if (packed.name !== 'nanoodle' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(packed.version) ||
              packed.filename !== `nanoodle-${packed.version}.tgz`) {
            throw new Error('Unexpected npm package metadata');
          }
          renameSync(join(RUNNER_TEMP, 'distribution', packed.filename), join(RUNNER_TEMP, 'distribution', 'package.tgz'));
          appendFileSync(GITHUB_OUTPUT, `version=${packed.version}\n`);
          JS
      - name: Check the version change for GitHub Releases
        id: source
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          PACKED_VERSION: ${{ steps.pack.outputs.version }}
        run: node .github/scripts/publish_source.mjs qualify "$PACKED_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/distribution/package.tgz
          if-no-files-found: error

  publish:
    name: Publish tested npm distribution
    if: ${{ github.repository == 'nanoodlecom/nanoodle-js' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.outputs.source_version != '' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    environment:
      name: npm
      url: https://www.npmjs.com/package/nanoodle/v/${{ needs.package.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
      - name: Publish version if absent from npm
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          registry_url="https://registry.npmjs.org/nanoodle/$VERSION"
          registry_metadata="$RUNNER_TEMP/registry.json"
          archive_integrity="sha512-$(openssl dgst -sha512 -binary package.tgz | openssl base64 -A)"
          verify_registry_archive() {
            if ! jq -e --arg version "$VERSION" --arg integrity "$archive_integrity" \
              '.name == "nanoodle" and .version == $version and .dist.integrity == $integrity' \
              "$registry_metadata" >/dev/null; then
              echo "npm metadata for nanoodle@$VERSION does not match the tested archive" >&2
              return 1
            fi
          }
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output "$registry_metadata" --write-out '%{http_code}' "$registry_url")"
          case "$status" in
            200)
              verify_registry_archive
              echo "The tested nanoodle@$VERSION archive is already published"
              ;;
            404)
              flags=()
              if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
              npm publish ./package.tgz --ignore-scripts --access public "${flags[@]}"
              # npm can acknowledge a publish before the version is visible to reads.
              curl --fail --silent --show-error --retry 36 --retry-all-errors --retry-delay 5 \
                --retry-max-time 180 --max-time 10 --output "$registry_metadata" "$registry_url"
              verify_registry_archive
              ;;
            *) echo "npm version lookup returned HTTP $status" >&2; exit 1 ;;
          esac

  github-source:
    name: Publish tested GitHub source release
    if: ${{ github.repository == 'nanoodlecom/nanoodle-js' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.outputs.source_version != '' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-source-${{ needs.package.outputs.source_version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - name: Tag and release the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERSION: ${{ needs.package.outputs.source_version }}
        run: node .github/scripts/publish_source.mjs publish "$SOURCE_VERSION"
